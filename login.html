<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — LoanNest</title>
  <meta name="description" content="Log in to your LoanNest account to view your loan balance, payment schedule and statements.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..580&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- GA_TAG — paste the Google Analytics snippet here -->

  <script>
    /* Apply the stored theme before first paint to avoid a flash of the wrong theme. */
    (function () {
      try {
        var stored = localStorage.getItem('loannest-theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (dark ? 'dark' : 'light'));
      } catch (e) { /* storage blocked — default theme stays applied */ }
    })();
  </script>
</head>

<body class="auth-body">
  <a class="skip-link" href="#loginForm">Skip to login form</a>

  <button class="theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
    <i class="ph ph-sun" aria-hidden="true"></i>
    <i class="ph ph-moon" aria-hidden="true"></i>
  </button>

  <main class="auth-wrap">
    <!-- ------------------------- Form panel ------------------------- -->
    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-brand">
          <a class="brand" href="index.html" aria-label="LoanNest — home">
            <img class="brand__logo" src="assets/images/loannest-logo.svg" alt="LoanNest" width="140" height="44">
          </a>
        </div>

        <div class="auth-card__head">
          <h1>Welcome back</h1>
          <p>Log in to manage your loan and payments.</p>
        </div>

        <div class="form-success" id="loginSuccess" role="status">
          <i class="ph ph-check-circle" aria-hidden="true"></i>
          <span><strong>Signed in.</strong> This is a demonstration form — no account was actually
            accessed.</span>
        </div>

        <!-- Demonstration form only — wire to a real authentication endpoint in production -->
        <form class="auth-form" id="loginForm" novalidate>
          <div class="field">
            <label for="loginEmail">Email address <span class="req" aria-hidden="true">*</span></label>
            <div class="field__wrap">
              <input type="email" id="loginEmail" name="email" placeholder="you@example.com"
                     autocomplete="email" required>
              <i class="ph ph-check-circle field__ok" aria-hidden="true"></i>
            </div>
            <span class="field__msg" role="alert"><i class="ph ph-warning-circle" aria-hidden="true"></i> Enter a valid email address.</span>
          </div>

          <div class="field field--password">
            <label for="loginPassword">Password <span class="req" aria-hidden="true">*</span></label>
            <div class="field__wrap">
              <input type="password" id="loginPassword" name="password" placeholder="••••••••"
                     autocomplete="current-password" required minlength="8">
              <button class="pw-toggle" type="button" aria-label="Show password" aria-pressed="false">
                <i class="ph ph-eye" aria-hidden="true"></i>
              </button>
            </div>
            <span class="field__msg" role="alert"><i class="ph ph-warning-circle" aria-hidden="true"></i> Use at least 8 characters.</span>
          </div>

          <div class="auth-row">
            <label class="checkbox" for="loginRemember" style="align-items:center;">
              <input type="checkbox" id="loginRemember" name="remember">
              <span>Remember me</span>
            </label>
            <a href="contact.html">Forgot password?</a>
          </div>

          <button class="btn btn--primary btn--block btn--auth" type="submit">
            Login to account
          </button>
        </form>

        <div class="auth-divider">or continue with</div>

        <div class="auth-alt">
          <button class="btn btn--ghost btn--block" type="button">
            <i class="ph ph-google-logo" aria-hidden="true"></i> Continue with Google
          </button>
          <button class="btn btn--ghost btn--block" type="button">
            <i class="ph ph-envelope-simple" aria-hidden="true"></i> Continue with Email
          </button>
        </div>

        <p class="auth-foot">Don't have an account? <a href="register.html">Register</a></p>
        <p class="auth-secure"><i class="ph ph-lock-simple" aria-hidden="true"></i> Secure connection</p>
      </div>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
