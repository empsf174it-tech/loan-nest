<svg width="286" height="90" viewBox="0 0 286 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LoanNest logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>LoanNest</title>

  <!-- ICON: nest cradling a roof-shaped mark, all one gold fill -->
  <g fill="#C9962E">
    <!-- nest bowl, built from layered woven arcs -->
    <path d="M8 58
             C8 46, 20 40, 45 40
             C70 40, 82 46, 82 58
             C82 62, 78 64, 72 62
             C64 68, 26 68, 18 62
             C12 64, 8 62, 8 58 Z" />
    <path d="M14 50
             C22 44, 68 44, 76 50
             C70 52, 60 48, 45 48
             C30 48, 20 52, 14 50 Z"
          opacity="0.55" />

    <!-- house/roof glyph resting in the nest, suggesting home + security -->
    <path d="M45 14
             L70 34
             L63 34
             L63 52
             L27 52
             L27 34
             L20 34 Z" />
    <!-- small door cut-out -->
    <path d="M40 52 L40 40 L50 40 L50 52 Z" fill="#FBF8F2" />
  </g>

  <!-- WORDMARK -->
  <text x="98" y="56"
        font-family="'Fraunces', 'Georgia', serif"
        font-size="38"
        font-weight="600"
        letter-spacing="0.5"
        fill="#C9962E">Loan<tspan font-weight="400">Nest</tspan></text>
</svg>
